<style>
:root{--bg:#f4f7fa;--sf:#fff;--in:#eef2f6;--tx:#0b1620;--mut:#6b7c8a;--ac:#3bb5ff;--ac2:#5ce3e6;--bd:#e3e9ef;--sh:0 4px 20px #0b162012}
[data-t=dark]{--bg:#080c11;--sf:#0f151c;--in:#1a2430;--tx:#eaf2f8;--mut:#8497a6;--bd:#212c38;--sh:none}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}h2,h3{margin:.3em 0}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04202e;border:0;border-radius:12px;padding:9px 16px;font-weight:700;transition:.15s}.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn.s{background:var(--in);color:var(--tx);border:1px solid var(--bd)}
.ib{background:none;border:0;font-size:17px;padding:6px 9px;border-radius:10px}.ib:hover{background:var(--in)}
input,select{background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;width:100%;margin:5px 0;outline:0}input:focus,select:focus{border-color:var(--ac)}
.lg{height:44px}.hide{display:none!important}.mt{color:var(--mut);font-size:12px}
#auth{max-width:360px;margin:7vh auto;padding:28px;text-align:center;background:var(--sf);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh)}
#auth .lg{height:64px;margin-bottom:10px}.tabs{display:flex;gap:6px;margin:14px 0}.tabs button{flex:1}.rc{font-size:12px;color:var(--mut);margin-top:16px}
#app{padding-left:236px}header{display:none}
#side{position:fixed;left:0;top:0;bottom:0;width:236px;padding:20px 14px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:20px;z-index:10}
#side .lg{height:40px;align-self:flex-start;margin:0 8px}
nav{display:flex;flex-direction:column;gap:4px;flex:1}
nav button{display:flex;align-items:center;gap:12px;background:none;border:0;padding:11px 14px;border-radius:12px;color:var(--mut);font-weight:600;font-size:15px;text-align:left}
nav button i{font-style:normal;font-size:19px}nav button:hover{background:var(--in)}nav button.on{background:var(--in);color:var(--ac)}
.sb{display:flex;flex-direction:column;gap:8px}
main{max-width:680px;margin:0 auto;padding:22px 16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;margin-bottom:18px;overflow:hidden;box-shadow:var(--sh)}
.ph{display:flex;align-items:center;gap:10px;padding:11px 14px}.ph b{cursor:pointer}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--bd);cursor:pointer}.av.big{width:96px;height:96px}
.card img.im{width:100%;display:block;background:var(--in)}
.act{display:flex;align-items:center;gap:4px;padding:6px 10px}.cp,.cmt{margin:0;padding:2px 14px 8px}.cs{padding:0 14px 12px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px}.st{text-align:center;font-size:12px;cursor:pointer;flex:none;width:66px;color:var(--mut)}
.st img{width:60px;height:60px;border-radius:50%;object-fit:cover;border:3px solid transparent;background:linear-gradient(var(--sf),var(--sf)) padding-box,linear-gradient(135deg,var(--ac),var(--ac2)) border-box}
.st.add img{border:2px dashed var(--ac);background:var(--in)}
.drop{border:2px dashed var(--bd);border-radius:16px;padding:18px;text-align:center;color:var(--mut);margin-bottom:18px;background:var(--sf);transition:.15s}.drop.o{border-color:var(--ac);background:var(--in)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;background:var(--in)}
.pf{display:flex;gap:20px;padding:22px;align-items:center}.pf p{margin:4px 0}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:10px;backdrop-filter:blur(4px)}
.box{background:var(--bg);border-radius:18px;padding:14px;max-width:480px;width:100%;max-height:96vh;overflow:auto}
canvas{width:100%;border-radius:12px;touch-action:none;background:#000}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.chat{display:grid;grid-template-columns:230px 1fr;gap:12px;min-height:60vh;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px}
.cl{display:flex;flex-direction:column;gap:6px}.ci{padding:10px 12px;border-radius:12px;background:var(--in);cursor:pointer;border:1px solid transparent}.ci.on{border-color:var(--ac)}
.msgs{height:48vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:8px 2px}
.m{background:var(--in);padding:8px 12px;border-radius:14px;max-width:80%;align-self:flex-start}.m.me{align-self:flex-end;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04202e}
.m small{display:block;opacity:.7;font-size:11px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#0b1620;color:#fff;padding:10px 18px;border-radius:12px;z-index:99;box-shadow:var(--sh)}
.av[src^="data:image/png"],.st img[src^="data:image/png"]{object-fit:contain;padding:24%;background-color:var(--in)}
.btn{white-space:nowrap}.pf .row>*{flex:0 0 auto}.pf>div{min-width:0}
@media(max-width:760px){
#app{padding-left:0;padding-bottom:70px}
header{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:9;background:var(--sf);border-bottom:1px solid var(--bd);padding:8px 14px}header .lg{height:30px}
#side{top:auto;width:100%;height:62px;flex-direction:row;padding:0;border-right:0;border-top:1px solid var(--bd)}
#side .lg,.sb{display:none}nav{flex-direction:row}
nav button{flex:1;flex-direction:column;gap:2px;justify-content:center;align-items:center;font-size:10px;padding:6px;border-radius:0}nav button i{font-size:20px}
.chat{grid-template-columns:1fr}.pf{flex-direction:column;text-align:center}}
body{-webkit-tap-highlight-color:transparent}
input,select{font-size:16px}
#app{min-height:100vh}
header .row{flex:none;gap:6px}header .row>*{flex:none;padding:7px 12px}
.row.w{flex-wrap:wrap}.row.w>*{flex:1 1 auto;padding:8px 10px;font-size:13px}
.msgs{height:calc(100vh - 300px);min-height:220px}
@media(min-width:761px){
#app{padding-left:240px}
main{max-width:740px;padding:26px 28px}
.chat{grid-template-columns:270px 1fr}
#cl.hide{display:flex!important}#bk{display:none}
#cv2.hide{display:block!important;color:var(--mut)}#cv2.hide::before{content:'Selecione uma conversa'}
.msgs{height:60vh}
}
@media(max-width:760px){#side{padding-bottom:env(safe-area-inset-bottom);height:calc(62px + env(safe-area-inset-bottom))}}
.msgs{height:auto!important;min-height:30vh;overflow:visible}
.inp{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));background:var(--sf);padding:8px 0;z-index:6}
@media(min-width:761px){.inp{bottom:0}}
.mw{position:relative}.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.car img{flex:0 0 100%;width:100%;max-height:75vh;object-fit:contain;scroll-snap-align:center;background:var(--in)}
.dots{display:flex;justify-content:center;gap:6px;padding:9px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--bd);cursor:pointer;transition:.15s}.dots i.on{background:var(--ac);transform:scale(1.3)}
.nv{position:absolute;top:45%;transform:translateY(-50%);background:#0009;color:#fff;border:0;border-radius:50%;width:32px;height:32px;font-size:20px;line-height:1;z-index:2}.nv.l{left:8px}.nv.r{right:8px}
@media(pointer:coarse){.nv{display:none}}
.chips{display:flex;gap:8px;margin-bottom:14px}.chip{background:var(--in);border:1px solid var(--bd);border-radius:20px;padding:6px 16px;font-weight:600;color:var(--mut)}.chip.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04202e;border-color:transparent}
input[type=color]{width:46px;height:42px;padding:2px;flex:none;cursor:pointer}input[type=range]{padding:0;border:0;background:none}
.ew{position:relative;line-height:0}.gf{position:absolute;pointer-events:none;height:auto}.ew .gf{pointer-events:auto;cursor:grab;touch-action:none}.mwh{position:relative}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:55vh;overflow:auto;margin:8px 0}.gg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;background:var(--in)}
.sv{background:#000d}.svb{position:relative;width:min(420px,100%);height:min(94vh,780px);background:#111;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;color:#fff}
.bars{display:flex;gap:4px;padding:10px 10px 4px;z-index:3}.bars i{flex:1;height:3px;background:#fff4;border-radius:2px;overflow:hidden}.bars i.d{background:#fff}.bars i.a::after{content:'';display:block;height:100%;background:#fff;animation:pg 6s linear forwards}

  if(!rdy){rdy=true;CH.forEach((x,id)=>{try{if(localStorage.getItem('vr:'+id)==null)localStorage.setItem('vr:'+id,Date.now())}catch(e){}})}

 NT.push(db.collection('follows').where('b','==',me.uid).onSnapshot(s=>{if(!fr){fr=true;return}

function renderList(){const l=$('#cl');if(!l)return;const q=(($('#cq')||{}).value||'').trim().toLowerCase();l.innerHTML='';
 const arr=[...CH].map(([id,x])=>({id,x,nm:chatName(x)||'Conversa',ms:(x.last&&x.last.ms)||(x.ts&&x.ts.toMillis?x.ts.toMillis():0)})).filter(o=>o.nm.toLowerCase().includes(q)).sort((a,b)=>b.ms-a.ms);
 if(!arr.length){l.innerHTML=`<p class="mt" style="padding:12px">${q?'Nenhuma conversa encontrada.':'Nenhuma conversa ainda. Toque em ＋ Nova para começar.'}</p>`;return}
 arr.forEach(o=>{const x=o.x,un=isUnread(o.id,x),e=document.createElement('div');e.className='ci'+(cu==o.id?' on':'')+(un?' un':'');

  e.innerHTML=`${grp?(x.photo?`<img class="av" src="${esc(x.photo)}">`:`<span class="c_av">${x.type=='community'?'🌐':'👥'}</span>`):`<img class="av" src="${ICON}">`}<div class="c_tx"><div class="c_nm">${esc(o.nm)}</div><div class="c_pv">${esc(pv)}</div></div><div class="c_mt"><span>${o.x.last?ago({toMillis:()=>o.x.last.ms}):''}</span>${un?'<span class="c_ub"></span>':''}</div>`;

async function searchUsers(raw){raw=raw.trim();if(!raw)return[];const h=normHandle(raw),qs=[];if(!raw.startsWith('@'))qs.push(db.collection('users').orderBy('name').startAt(raw).endAt(raw+'\uf8ff').limit(8).get());if(h)qs.push(db.collection('users').orderBy('handle').startAt(h).endAt(h+'\uf8ff').limit(8).get());
 const seen=new Set(),out=[];(await Promise.all(qs)).forEach(r=>r.forEach(d=>{if(!seen.has(d.id)&&d.id!=me.uid){seen.add(d.id);out.push(d)}}));return out}

 inp.oninput=()=>{clearTimeout(tm);tm=setTimeout(async()=>{box.innerHTML='';try{const L=await searchUsers(inp.value);if(!L.length&&inp.value.trim())box.innerHTML='<p class="mt">Ninguém encontrado.</p>';
  L.forEach(d=>{const u=d.data(),e=document.createElement('div');e.className='mrow';e.style.cursor='pointer';e.innerHTML=`<img class="av" src="${esc(u.photo||ICON)}"><div style="flex:1;min-width:0"><b>${esc(u.name)}</b>${u.handle?`<div class="mt">@${esc(u.handle)}</div>`:''}</div>`;e.onclick=()=>onPick(d.id,u,m,e);box.append(e)})}catch(er){showErr(er,'buscar')}},250)};
 inp.focus();return m}

const IC={img:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/>',camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',contrast:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',

 up:'<path d="M12 19V5M5 12l7-7 7 7"/>',down:'<path d="M12 5v14M5 12l7 7 7-7"/>',left:'<path d="M19 12H5M12 5l-7 7 7 7"/>',right:'<path d="M5 12h14M12 5l7 7-7 7"/>',target:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',vol:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/>',mute:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>'},
 GL={'🖼':'img','📷':'camera','🗂':'layers','🎵':'music','🌓':'contrast','⚙':'gear','▶':'play','⬇':'download','✕':'x','🗑':'trash','🔎':'search','🔔':'bell','＋':'plus','+':'plus','↩':'undo','⬆':'up','⏺':'target','🔊':'vol','🔇':'mute','←':'left'},
 AL={'◀':'left','▶':'right','▲':'up','▼':'down'},GRX=/^\s*(🖼|📷|🗂|🎵|🌓|⚙|▶|⬇|✕|🗑|🔎|🔔|＋|\+|↩|⬆|⏺|🔊|🔇|←)\uFE0F?\s?/u;
function icoEl(k){const e=document.createElement('span');e.className='ico';e.innerHTML='<svg viewBox="0 0 24 24">'+IC[k]+'</svg>';return e}
function icify(b){const n=b.firstChild;if(!n||n.nodeType!=3)return;const t=n.nodeValue,tt=t.trim().replace(/\uFE0F/g,'');
 if(b.childNodes.length==1&&AL[tt]){b.replaceChild(icoEl(AL[tt]),n);if(!b.getAttribute('aria-label'))b.setAttribute('aria-label',b.title||'');return}
 const m=t.match(GRX);if(!m)return;const g=m[1],k=GL[g];if(!k)return;b.insertBefore(icoEl(k),n);n.nodeValue=t.slice(m[0].length);if(!n.nodeValue.trim()){n.remove();if(!b.getAttribute('aria-label')&&b.title)b.setAttribute('aria-label',b.title)}}
function lazyImg(i){if(i.dataset.lz)return;i.dataset.lz=1;if(!i.hasAttribute('loading')&&!i.closest('#splash,#auth,.rl_o'))i.loading='lazy';i.decoding='async'}
function lazyOnce(el,fn){const io=new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting)){io.disconnect();fn()}},{rootMargin:'800px'});io.observe(el)}
function sideUser(){const b=$('#sbu');if(!b||!me)return;b.innerHTML=`<img class="av" src="${esc(me.photo||ICON)}"><div><b class="sbn">${esc(me.name)}</b><div class="mt sbn">${me.handle?'@'+esc(me.handle):''}</div></div>`;b.onclick=()=>go('me')}
const proc=n=>{if(n.nodeType!=1)return;if(n.tagName=='BUTTON')icify(n);else if(n.tagName=='IMG')lazyImg(n);if(n.querySelectorAll){n.querySelectorAll('button').forEach(icify);n.querySelectorAll('img').forEach(lazyImg)}};
new MutationObserver(ms=>ms.forEach(m=>{m.addedNodes.forEach(proc);if(m.type=='characterData'){const pe=m.target.parentElement;if(pe&&pe.tagName=='BUTTON')icify(pe)}})).observe(document.body,{childList:true,subtree:true,characterData:true});
proc(document.body);

function confirmUI(text,o){o=o||{};return new Promise(res=>{const m=modal(`<h3>${esc(o.title||'Tem certeza?')}</h3><p class="mt" style="margin:0 0 18px;overflow-wrap:anywhere">${esc(text)}</p><div class="row" style="gap:8px"><button class="btn s" id="cn0">Cancelar</button><button class="btn" id="cn1"${o.danger?' style="background:#e5484d;color:#fff"':''}>${esc(o.ok||'Confirmar')}</button></div>`);let done=false;const fin=v=>{if(done)return;done=true;m.remove();res(v)};
 m.querySelector('#cn0').onclick=()=>fin(false);m.querySelector('#cn1').onclick=()=>fin(true);m.addEventListener('click',e=>{if(e.target==m)fin(false)});m.querySelector('#cn1').focus()})}

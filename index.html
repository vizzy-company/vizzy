#app{padding-left:236px}header{display:none}

function viewStories(list){let i=0,tm,au;const m=document.createElement('div');m.className='modal sv';document.body.append(m);
 const close=()=>{clearTimeout(tm);if(au)au.pause();m.remove();document.removeEventListener('keydown',kd)},
 kd=e=>{if(e.key=='Escape')close();if(e.key=='ArrowRight'){i++;show()}if(e.key=='ArrowLeft'){i--;show()}};
 document.addEventListener('keydown',kd);
 function show(){clearTimeout(tm);if(au){au.pause();au=null}if(i>=list.length)return close();if(i<0)i=0;const x=list[i],my=i;
  m.innerHTML=`<div class="svb"><div class="bars">${list.map((_,k)=>`<i class="${k<i?'d':k==i?'a':''}"></i>`).join('')}</div><div class="svh"><img class="av" src="${x.avatar||ICON}"><b>${esc(x.name)}</b><small>${ago(x.ts)}</small><button class="ib" id="sx" style="margin-left:auto;color:#fff">✕</button></div><div class="svc"><div class="svw"><img src="${x.img}">${gifHTML(x.gifs)}</div></div><div class="tp l"></div><div class="tp r"></div></div>`;
  m.querySelector('#sx').onclick=close;m.querySelector('.l').onclick=()=>{i--;show()};m.querySelector('.r').onclick=()=>{i++;show()};
  tm=setTimeout(()=>{i++;show()},6000);
  if(x.audio)audSrc(x.audio).then(s=>{if(s&&my==i&&document.body.contains(m)){au=new Audio(s);au.play().catch(()=>{})}})}

function gifPicker(cb){const m=modal('<input id="gq" placeholder="🔎 Buscar GIFs"><div class="gg" id="gg"></div><p class="mt">Powered by KLIPY</p>'),gg=m.querySelector('#gg');

  try{const r=await fetch(`https://api.klipy.com/api/v1/${KLIPY}/gifs/${q?'search':'trending'}?per_page=24&customer_id=${encodeURIComponent(me.uid)}${q?'&q='+encodeURIComponent(q):''}`),j=await r.json(),
   L=((j.data&&j.data.data)||[]).map(x=>{const f=x.file||{};return(f.md||f.sm||f.hd||{}).gif?.url}).filter(Boolean);
   gg.innerHTML=L.length?'':'<p class="mt">Nenhum GIF encontrado.</p>';
   L.forEach(s=>{const i=document.createElement('img');i.src=s;i.loading='lazy';i.onclick=()=>{m.remove();cb(s)};gg.append(i)})}

async function editor(file,col){

 const auds=await db.collection('audios').where('uid','==',me.uid).get();
 const m=modal(`<div class="ew" id="ew"><canvas id="cv"></canvas></div>
 <input id="cp" placeholder="Texto na imagem (arraste para mover)" maxlength="120">
 <div class="row w"><input type="color" id="tc" value="#ffffff" title="Cor do texto"><select id="tf">${FONTS.map((f,i)=>`<option value="${i}">${f[0]}</option>`).join('')}</select><select id="tb"><option value="1">Fundo escuro</option><option value="2">Fundo claro</option><option value="0">Sem fundo</option></select></div>

 <div class="row w"><button class="btn s" id="sk">+ Adesivo</button><button class="btn s" id="gf">+ GIF</button><button class="btn s" id="un">↩ Desfazer</button></div>
 <button class="btn" id="pb" style="width:100%;margin-top:6px">Publicar</button>`);
 const $m=s=>m.querySelector(s),cv=$m('#cv'),c=cv.getContext('2d'),ew=$m('#ew');cv.width=base.width;cv.height=base.height;
 const wrap=(txt,max)=>{const L=[];let cur='';txt.split(' ').forEach(x=>{const k=cur?cur+' '+x:x;if(c.measureText(k).width>max&&cur){L.push(cur);cur=x}else cur=k});L.push(cur);return L};
 const draw=()=>{c.clearRect(0,0,cv.width,cv.height);c.drawImage(base,0,0);st.forEach(s=>{const w=s.w0*s.sc;c.drawImage(s.i,s.x,s.y,w,w*s.r)});T.bb=null;
  if(T.t){const f=Math.max(16,cv.width/15)*T.size;c.font=`bold ${f}px ${T.font}`;c.textAlign='center';c.textBaseline='middle';
   const L=wrap(T.t,cv.width*.88),lh=f*1.25,p=f*.4,w=Math.max(...L.map(l=>c.measureText(l).width))+p*2,h=L.length*lh+p;
   if(T.x==null){T.x=cv.width/2;T.y=cv.height-h/2-cv.height*.06}
   const x0=T.x-w/2,y0=T.y-h/2;if(T.bg){c.fillStyle=T.bg==1?'rgba(0,0,0,.6)':'rgba(255,255,255,.8)';c.fillRect(x0,y0,w,h)}
   c.fillStyle=T.color;if(!T.bg){c.lineWidth=f/7;c.strokeStyle='#000';c.lineJoin='round'}
   L.forEach((l,i)=>{const yy=y0+p/2+lh*(i+.5);if(!T.bg)c.strokeText(l,T.x,yy);c.fillText(l,T.x,yy)});T.bb={x:x0,y:y0,w,h}}};draw();
 $m('#cp').oninput=e=>{T.t=e.target.value;sel={k:'t'};draw()};
 $m('#tc').oninput=e=>{T.color=e.target.value;draw()};$m('#tf').onchange=e=>{T.font=FONTS[+e.target.value][1];draw()};$m('#tb').onchange=e=>{T.bg=+e.target.value;draw()};
 $m('#sz').oninput=e=>{const v=e.target.value/100;if(!sel||sel.k=='t')T.size=v;else{sel.o.sc=v;if(sel.k=='g')sel.o.el.style.width=sel.o.w0*v+'%'}draw()};
 $m('#sk').onclick=async()=>{const f=await pick('image/*');if(!f)return;const i=await loadImg(await shrink(f,300,80e3)),s={i,x:cv.width/3,y:cv.height/3,w0:cv.width/3,sc:1,r:i.height/i.width};st.push(s);order.push({k:'s',o:s});draw()};
 const addGif=u=>{const o={u,x:30,y:30,w0:35,sc:1},el=document.createElement('img');o.el=el;el.className='gf';el.src=u;el.draggable=false;el.style.cssText=`left:30%;top:30%;width:35%`;

  el.onpointermove=e=>{if(!o.drag)return;const r=ew.getBoundingClientRect();o.x=(e.clientX-r.left)/r.width*100-o.dx;o.y=(e.clientY-r.top)/r.height*100-o.dy;el.style.left=o.x+'%';el.style.top=o.y+'%'};el.onpointerup=()=>o.drag=0;

 $m('#pb').onclick=async e=>{const bt=e.target;bt.disabled=true;bt.textContent='Publicando...';

   if(col=='posts'){d.cap=$m('#tx').value.trim();d.likes=[]}await db.collection(col).add(d);m.remove();go('feed')}

 <h3>Áudios</h3><div class="card" style="padding:14px"><p class="mt">Envie áudios do seu computador e use em fotos e stories.</p><button class="btn s" id="s4">🎵 Gerenciar áudios</button></div>
 <p class="mt">No editor você coloca texto com cor e fonte, adesivos, GIFs do Klipy e áudio.</p>`;
 const dz=$('#dz');dz.ondragover=e=>{e.preventDefault();dz.classList.add('o')};dz.ondragleave=()=>dz.classList.remove('o');
 dz.ondrop=e=>{e.preventDefault();dz.classList.remove('o');const fs=[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'));if(fs.length>1)carousel(fs);else if(fs[0])editor(fs[0],'posts')};
 $('#s1').onclick=async()=>{const f=await pick('image/*');f&&editor(f,'posts')};if(mobile)$('#s2').onclick=async()=>{const f=await pick('image/*',1);f&&editor(f,'posts')};
 $('#s3').onclick=async()=>{const fs=await pick('image/*',0,1);fs&&fs.length&&carousel(fs)};
 $('#t1').onclick=async()=>{const f=await pick('image/*');f&&editor(f,'stories')};if(mobile)$('#t2').onclick=async()=>{const f=await pick('image/*',1);f&&editor(f,'stories')};
 $('#s4').onclick=()=>go('aud')}
// ÁUDIOS
async function aud(){$('#main').innerHTML=`<div class="drop" id="da">Arraste arquivos de áudio do computador (até 15 MB cada)<br><button class="btn s" id="ba" style="margin-top:8px">Escolher áudio</button></div><div id="al"></div>`;
 const up=async f=>{if(!f||!f.type.startsWith('audio/'))return;if(f.size>15e6)return toast('Áudio maior que 15 MB');$('#ba').textContent='Enviando...';const d=await readURL(f),r=await db.collection('audios').add({uid:me.uid,name:f.name.slice(0,40),ts:TS()});for(let i=0;i*7e5<d.length;i++)await r.collection('chunks').doc(String(i).padStart(4,'0')).set({i,d:d.slice(i*7e5,(i+1)*7e5)});$('#ba').textContent='Escolher áudio';list()};
 $('#ba').onclick=async()=>up(await pick('audio/*'));const d=$('#da');d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();up(e.dataTransfer.files[0])};
 async function list(){const s=await db.collection('audios').where('uid','==',me.uid).get();$('#al').innerHTML='';s.forEach(x=>{const e=document.createElement('div');e.className='card ph';e.innerHTML=`<span style="flex:1">🎵 ${esc(x.data().name)}</span><button class="btn s p">▶</button><button class="btn s x">Excluir</button>`;e.querySelector('.p').onclick=ev=>playAudio(x.id,ev.target);e.querySelector('.x').onclick=async()=>{const c=await x.ref.collection('chunks').get();for(const k of c.docs)await k.ref.delete();await x.ref.delete();e.remove()};$('#al').append(e)})}list()}
// PERFIL
function viewProfile(uid){document.querySelectorAll('.modal').forEach(m=>m.remove());document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v=='me'&&uid==me.uid));if(unsub){unsub();unsub=null}prof(uid)}
async function listUsers(title,ids){const m=modal(`<h3>${title}</h3><div id="ul"></div>`),b=m.querySelector('#ul');if(!ids.length)b.innerHTML='<p class="mt">Ninguém por aqui ainda.</p>';
 for(const id of ids.slice(0,50)){const d=await db.collection('users').doc(id).get();if(d.exists)b.append(userRow(id,d.data()))}}
async function prof(uid){uid=typeof uid=='string'?uid:me.uid;const own=uid==me.uid,u=own?me:((await db.collection('users').doc(uid).get()).data()||{name:'Usuário'});
 const [ps,fr,fg]=await Promise.all([db.collection('posts').where('uid','==',uid).get(),db.collection('follows').where('b','==',uid).get(),db.collection('follows').where('a','==',uid).get()]);
 const docs=ps.docs.sort((a,b)=>(b.data().ts?.toMillis?.()||9e15)-(a.data().ts?.toMillis?.()||9e15));let isF=fol.has(uid),nF=fr.size;
 $('#main').innerHTML=`<div class="card pf"><img class="av big" id="pa" src="${u.photo||ICON}"><div><h2>${esc(u.name)}</h2><p class="mt" style="font-size:14px">${esc(u.bio||'Sem bio ainda.')}</p><p><b>${docs.length}</b> posts · <b id="nf" style="cursor:pointer">${nF}</b> seguidores · <b id="ng" style="cursor:pointer">${fg.size}</b> seguindo</p>${own?'<button class="btn s" id="eb">⚙️ Editar perfil</button>':'<div class="row w"><button class="btn" id="fl"></button><button class="btn s" id="dm">💬 Mensagem</button></div>'}</div></div><div class="grid" id="gr"></div>`;
 grid($('#gr'),docs);$('#nf').onclick=()=>listUsers('Seguidores',fr.docs.map(d=>d.data().a));$('#ng').onclick=()=>listUsers('Seguindo',fg.docs.map(d=>d.data().b));
 if(own)$('#eb').onclick=()=>go('cfg');
 else{const fb=$('#fl'),r=()=>{fb.textContent=isF?'Seguindo ✓':'Seguir';fb.className='btn'+(isF?' s':'')};r();
  fb.onclick=async()=>{const ref=db.collection('follows').doc(me.uid+'_'+uid);try{if(isF){await ref.delete();fol.delete(uid);nF--}else{await ref.set({a:me.uid,b:uid,ts:TS()});fol.add(uid);nF++}isF=!isF;r();$('#nf').textContent=nF}catch(e){showErr(e)}};
  $('#dm').onclick=async()=>{const id=[me.uid,uid].sort().join('_');await db.collection('chats').doc(id).set({type:'dm',members:[me.uid,uid],names:{[me.uid]:me.name,[uid]:u.name},ts:TS()},{merge:true});go('msg')}}}
// AJUSTES
const EM={'auth/wrong-password':'Senha atual incorreta','auth/invalid-credential':'Senha atual incorreta','auth/email-already-in-use':'Esse e-mail já está em uso','auth/invalid-email':'E-mail inválido','auth/weak-password':'A nova senha precisa ter pelo menos 6 caracteres','auth/too-many-requests':'Muitas tentativas. Tente mais tarde','auth/requires-recent-login':'Entre de novo na conta e tente outra vez'};
const errMsg=e=>EM[e.code]||e.message;
async function reauth(p){const u=auth.currentUser;await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,p))}
function settings(){const u=auth.currentUser;
 $('#main').innerHTML=`<h2>Configurações</h2>
 <div class="card" style="padding:16px"><h3>Perfil</h3><div class="row" style="justify-content:flex-start;margin-bottom:8px"><img class="av big" id="pa" src="${me.photo||ICON}" style="flex:none"><div class="row w"><button class="btn s" id="cf">Trocar foto</button>${mobile?'<button class="btn s" id="cc">📷 Câmera</button>':''}<button class="btn s" id="rf">Remover</button></div></div><label class="mt">Bio</label><input id="bio" maxlength="150" placeholder="Fale sobre você" value="${esc(me.bio||'')}"><button class="btn" id="sb2">Salvar perfil</button></div>
 <div class="card" style="padding:16px"><h3>Aparência</h3><button class="btn s" id="tg">🌓 Alternar claro / escuro</button></div>
 <div class="card" style="padding:16px"><h3>E-mail</h3><p class="mt">Atual: ${esc(u.email)}</p><input id="ne" type="email" placeholder="Novo e-mail"><input id="pe" type="password" placeholder="Senha atual"><button class="btn" id="be">Alterar e-mail</button></div>
 <div class="card" style="padding:16px"><h3>Senha</h3><input id="p0" type="password" placeholder="Senha atual"><input id="p1" type="password" placeholder="Nova senha (mín. 6)"><input id="p2" type="password" placeholder="Repita a nova senha"><button class="btn" id="bp">Alterar senha</button></div>
 <div class="card" style="padding:16px"><button class="btn s" id="lg2" style="width:100%">Sair da conta</button></div>`;
 const set=async f=>{if(!f)return;me.photo=await shrink(f,200,60e3);await db.collection('users').doc(me.uid).update({photo:me.photo});$('#pa').src=me.photo;toast('Foto atualizada')};
 $('#cf').onclick=async()=>set(await pick('image/*'));if(mobile)$('#cc').onclick=async()=>set(await pick('image/*',1));
 $('#rf').onclick=async()=>{me.photo='';await db.collection('users').doc(me.uid).update({photo:''});$('#pa').src=ICON;toast('Foto removida')};
 $('#sb2').onclick=async()=>{me.bio=$('#bio').value.trim().slice(0,150);await db.collection('users').doc(me.uid).update({bio:me.bio});toast('Perfil salvo')};
 $('#tg').onclick=()=>theme(document.documentElement.dataset.t=='dark'?'light':'dark');
 $('#lg2').onclick=()=>auth.signOut();
 $('#be').onclick=async()=>{const n=$('#ne').value.trim(),p=$('#pe').value;if(!n||!p)return toast('Preencha o novo e-mail e a senha atual');try{await reauth(p);await auth.currentUser.verifyBeforeUpdateEmail(n);$('#pe').value='';toast('Enviamos um link de confirmação para '+n+'. O e-mail só muda depois que você clicar nele.')}catch(e){toast(errMsg(e))}};
 $('#bp').onclick=async()=>{const a=$('#p0').value,b=$('#p1').value;if(!a)return toast('Digite a senha atual');if(b.length<6)return toast('A nova senha precisa ter pelo menos 6 caracteres');if(b!==$('#p2').value)return toast('As senhas não coincidem');try{await reauth(a);await auth.currentUser.updatePassword(b);['#p0','#p1','#p2'].forEach(s=>$(s).value='');toast('Senha alterada!')}catch(e){toast(errMsg(e))}}}
// MENSAGENS
let cu=null;
function msg(){$('#main').innerHTML=`<div class="row w" style="margin-bottom:10px"><button class="btn s" id="n1">+ DM</button><button class="btn s" id="n2">+ Grupo</button><button class="btn s" id="n3">+ Comunidade</button><button class="btn s" id="n4">Explorar</button></div><div class="chat"><div class="cl" id="cl"></div><div id="cv2" class="hide"></div></div>`;
 const byName=async n=>{const s=await db.collection('users').where('name','==',n.trim()).limit(1).get();return s.empty?null:s.docs[0].id};
 $('#n1').onclick=async()=>{const n=prompt('Nome do usuário:');if(!n)return;const u=await byName(n);if(!u)return toast('Usuário não encontrado');const id=[me.uid,u].sort().join('_');await db.collection('chats').doc(id).set({type:'dm',members:[me.uid,u],names:{[me.uid]:me.name,[u]:n.trim()},ts:TS()},{merge:true})};
 $('#n2').onclick=async()=>{const t=prompt('Nome do grupo:');if(!t)return;const l=(prompt('Usuários (separados por vírgula):')||'').split(',').filter(x=>x.trim()),mem=[me.uid];for(const n of l){const u=await byName(n);u?mem.push(u):toast(n+' não encontrado')}await db.collection('chats').add({type:'group',name:t,members:mem,ts:TS()})};
 $('#n3').onclick=async()=>{const t=prompt('Nome da comunidade:');t&&await db.collection('chats').add({type:'community',name:t,members:[me.uid],ts:TS()})};
 $('#n4').onclick=async()=>{const s=await db.collection('chats').where('type','==','community').limit(30).get(),m=modal('<h3>Comunidades</h3><div id="ex"></div>');s.forEach(d=>{const x=d.data(),j=x.members.includes(me.uid),e=document.createElement('div');e.className='ph';e.innerHTML=`<b style="flex:1">${esc(x.name)} <small>(${x.members.length})</small></b>`+(j?'<small>Membro</small>':'<button class="btn">Entrar</button>');const b=e.querySelector('button');if(b)b.onclick=async()=>{await d.ref.update({members:firebase.firestore.FieldValue.arrayUnion(me.uid)});b.remove()};m.querySelector('#ex').append(e)})};
 unsub=db.collection('chats').where('members','array-contains',me.uid).onSnapshot(s=>{const l=$('#cl');if(!l)return;l.innerHTML=s.empty?'<p class="mt">Nenhuma conversa ainda. Use + DM, + Grupo ou Explorar para entrar numa comunidade.</p>':'';s.forEach(d=>{const x=d.data(),nm=x.type=='dm'?Object.entries(x.names||{}).find(([k])=>k!=me.uid)?.[1]||'DM':x.name,e=document.createElement('div');e.className='ci'+(cu==d.id?' on':'');e.textContent=({dm:'💬 ',group:'👥 ',community:'🌐 '})[x.type]+nm;e.onclick=()=>openChat(d.id,nm);l.append(e)})},showErr)}
let mu=null;
function openChat(id,nm){cu=id;if(mu)mu();$('#cl').classList.add('hide');$('#cv2').classList.remove('hide');$('#cv2').innerHTML=`<div class="row" style="justify-content:flex-start"><button class="btn s" id="bk" style="flex:none">←</button><b>${esc(nm)}</b></div><div class="msgs" id="ms"></div><div class="row inp"><input id="mi" placeholder="Mensagem" autocomplete="off" enterkeyhint="send"><button class="btn" style="flex:none" id="sd">Enviar</button></div>`;
 $('#bk').onclick=()=>{cu=null;if(mu){mu();mu=null}$('#cv2').classList.add('hide');$('#cl').classList.remove('hide')};const send=async()=>{const t=$('#mi').value.trim();if(!t)return;$('#mi').value='';await db.collection('chats').doc(id).collection('msgs').add({uid:me.uid,name:me.name,t,ts:TS()})};$('#sd').onclick=send;$('#mi').onkeydown=e=>{if(e.key=='Enter')send()};
 mu=db.collection('chats').doc(id).collection('msgs').orderBy('ts','desc').limit(100).onSnapshot(s=>{const b=$('#ms');if(!b)return;b.innerHTML='';s.docs.reverse().forEach(d=>{const x=d.data(),e=document.createElement('div');e.className='m'+(x.uid==me.uid?' me':'');e.innerHTML=`<small>${esc(x.name)}</small>${esc(x.t)}`;b.append(e)});window.scrollTo(0,document.body.scrollHeight)},showErr)}
setMode(false);document.querySelectorAll('.lob').forEach(b=>b.onclick=()=>auth.signOut());
</script></body></html>
